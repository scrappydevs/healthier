services:
  - type: web
    name: healthier-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        fromService:
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CEREBRAS_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DEBUG
        value: false
